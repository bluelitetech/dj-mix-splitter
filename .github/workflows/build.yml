name: test-and-publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install "yt-dlp[default]" shazamio pytest
      - run: pytest -q tests

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dj-mix-splitter:latest
            ghcr.io/${{ github.repository_owner }}/dj-mix-splitter:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # Container image smoke test: tools present + offline tests inside the image
      - run: |
          docker run --rm --entrypoint sh ghcr.io/${{ github.repository_owner }}/dj-mix-splitter:latest \
            -c "ffmpeg -version | head -1 && deno --version | head -1 && yt-dlp --version && python -c 'import shazamio, trackid, webui'" 

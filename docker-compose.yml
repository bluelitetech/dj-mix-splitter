# Paste this into your NAS's Docker "Project / Compose" screen.
# Set up for the UGREEN NAS: music goes into the same folder Navidrome reads.
services:
  mix-splitter:
    image: ghcr.io/bluelitetech/dj-mix-splitter:latest
    container_name: mix-splitter
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - /volume2/arr-library/media/music:/music   # same folder Navidrome reads (Navidrome can stay :ro; this needs write)
      - mix-splitter-data:/data            # job logs + reports (+ cookies.txt if ever needed)
    environment:
      - MUSIC_LIBRARY=/music/DJ Mixes      # songs land in <music>/DJ Mixes/<DJ>/<Mix>/
      - TZ=America/New_York
      # - YTDLP_COOKIES=/data/cookies.txt  # only if YouTube starts asking to sign in
      # Optional: start a Navidrome library scan as soon as songs are saved (needs a Navidrome admin login)
      # - NAVIDROME_URL=http://<nas-ip>:4533
      # - NAVIDROME_USER=admin
      # - NAVIDROME_PASSWORD=your-password

volumes:
  mix-splitter-data:
